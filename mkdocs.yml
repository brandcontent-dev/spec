site_name: Agentic Brand Content
site_description: A spec for publishers to serve structured brand context to AI agents.
site_url: https://brandcontent.dev
copyright: Agentic Brand Content · Spec v0.1 · Apache-2.0 · <a href="mailto:contact@brandcontent.dev">contact@brandcontent.dev</a>

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.instant
    - navigation.top
    - navigation.sections

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brandcontent-dev

nav:
  - Agentic Brand Content: index.md
  - Integration: integration.md
  - Agents: agents.md
  - Get started: getting-started.md
